name: Build and Deploy Jekyll

on:
  push:
    branches:
      - master  # Change to 'main' if that is your default branch name

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # Uses a modern Ruby version (Fixes the ffi error)
          bundler-cache: true # Speeds up future builds

      - name: Build site
        run: |
          bundle install
          bundle exec jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_deploy
    permissions:
      pages: write      # Required for deploying to Pages
      id-token: write   # Required for deploying to Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
